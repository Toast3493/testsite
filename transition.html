<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход...</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили только для страницы перехода */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .transition-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleEffect 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        body.theme-light .ripple:nth-child(1) {
            background: linear-gradient(135deg, #ed1c24, #f7941d);
            animation-delay: 0s;
        }

        body.theme-light .ripple:nth-child(2) {
            background: linear-gradient(135deg, #f7941d, #fbb03b);
            animation-delay: 0.15s;
        }

        body.theme-light .ripple:nth-child(3) {
            background: linear-gradient(135deg, #be1e2d, #ed1c24);
            animation-delay: 0.3s;
        }

        body.theme-dark .ripple:nth-child(1) {
            background: linear-gradient(135deg, #7864ff, #64c8ff);
            animation-delay: 0s;
        }

        body.theme-dark .ripple:nth-child(2) {
            background: linear-gradient(135deg, #64c8ff, #ff82c8);
            animation-delay: 0.15s;
        }

        body.theme-dark .ripple:nth-child(3) {
            background: linear-gradient(135deg, #ff82c8, #7864ff);
            animation-delay: 0.3s;
        }

        @keyframes rippleEffect {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0.8;
            }
        }

        .loading-text {
            position: relative;
            z-index: 10000;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            animation: fadeInOut 1.5s ease forwards;
            font-family: 'Inter', sans-serif;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            30% {
                opacity: 1;
                transform: translateY(0);
            }
            70% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body class="theme-light">
    <div class="transition-container">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="loading-text">Загрузка...</div>
    </div>

    <script>
        // Определяем тему
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.classList.remove('theme-light', 'theme-dark');
        document.body.classList.add('theme-' + savedTheme);

        // Получаем целевой URL из параметра
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('to');

        // После завершения анимации переходим на целевую страницу
        setTimeout(() => {
            if (targetPage) {
                window.location.href = targetPage;
            } else {
                window.location.href = 'index.html';
            }
        }, 1200);
    </script>
</body>
</html>
