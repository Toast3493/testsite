<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход...</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .transition-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        /* ===== АНИМИРОВАННЫЙ ПОЕЗД ===== */
        .metro-scene {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 200px;
            margin-bottom: 40px;
        }

        .rails {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #666, #999, #666);
            border-radius: 4px;
        }

        .rails::before {
            content: '';
            position: absolute;
            bottom: -12px;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                #888 0px,
                #888 20px,
                transparent 20px,
                transparent 40px
            );
        }

        .train {
            position: absolute;
            bottom: 48px;
            left: -150px;
            width: 120px;
            height: 60px;
            animation: trainMove 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .train.arrived .wheel {
            animation-play-state: paused;
        }

        .train-car {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ed1c24, #f7941d);
            border-radius: 12px 12px 8px 8px;
            position: relative;
            box-shadow: 0 4px 15px rgba(237, 28, 36, 0.4);
        }

        body.theme-dark .train-car {
            background: linear-gradient(135deg, #7864ff, #64c8ff);
            box-shadow: 0 4px 15px rgba(120, 100, 255, 0.4);
        }

        .train-car::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .train-car::after {
            content: 'М';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .train-wheels {
            position: absolute;
            bottom: -8px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
        }

        .wheel {
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            border: 3px solid #666;
            animation: wheelSpin 0.3s linear infinite;
        }

        @keyframes trainMove {
            0% {
                left: -150px;
            }
            100% {
                left: calc(100% - 120px);
            }
        }

        @keyframes wheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== ЦИТАТЫ В РАЗНЫХ МЕСТАХ ===== */
        .quote {
            position: absolute;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            opacity: 0;
            transform: scale(0.8);
            animation: quoteAppear 2.5s ease-in-out infinite;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 250px;
            text-align: center;
        }

        body.theme-light .quote {
            color: #2d2d4a;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(237, 28, 36, 0.2);
        }

        body.theme-dark .quote {
            background: rgba(120, 100, 255, 0.15);
            border: 1px solid rgba(120, 100, 255, 0.3);
        }

        /* Цитата 1 - справа сверху */
        .quote:nth-child(1) {
            top: 15%;
            right: 10%;
            animation-delay: 0s;
        }

        /* Цитата 2 - слева снизу */
        .quote:nth-child(2) {
            bottom: 20%;
            left: 8%;
            animation-delay: 0.625s;
        }

        /* Цитата 3 - слева сверху */
        .quote:nth-child(3) {
            top: 25%;
            left: 12%;
            animation-delay: 1.25s;
        }

        /* Цитата 4 - справа снизу */
        .quote:nth-child(4) {
            bottom: 15%;
            right: 8%;
            animation-delay: 1.875s;
        }

        @keyframes quoteAppear {
            0%, 100% {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }
            15%, 35% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            50%, 85% {
                opacity: 0;
                transform: scale(0.8) translateY(-10px);
            }
        }

        /* ===== ПРОГРЕСС-БАР И ТЕКСТ ===== */
        .loading-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        body.theme-light .progress-container {
            background: rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ed1c24, #f7941d, #fbb03b);
            border-radius: 3px;
            width: 0%;
            animation: progressFill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 10px rgba(237, 28, 36, 0.5);
        }

        body.theme-dark .progress-bar {
            background: linear-gradient(90deg, #7864ff, #64c8ff, #ff82c8);
            box-shadow: 0 0 10px rgba(120, 100, 255, 0.5);
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .station-text {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            animation: textPulse 2.5s ease-in-out infinite;
        }

        body.theme-light .station-text {
            color: #5a5a7a;
        }

        .station-text span {
            color: #ed1c24;
            font-weight: 700;
        }

        body.theme-dark .station-text span {
            color: #64c8ff;
        }

        @keyframes textPulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(0.98);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* ===== ПАРЯЩИЕ ИКОНКИ ===== */
        .floating-icons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-icon {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        .floating-icon:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-icon:nth-child(2) { top: 60%; right: 15%; animation-delay: 1s; }
        .floating-icon:nth-child(3) { top: 30%; right: 20%; animation-delay: 2s; }
        .floating-icon:nth-child(4) { bottom: 25%; left: 15%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* ===== RIPPLE ЭФФЕКТ ===== */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: rippleEffect 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0.1;
        }

        body.theme-light .ripple {
            background: linear-gradient(135deg, #ed1c24, #f7941d);
        }

        body.theme-dark .ripple {
            background: linear-gradient(135deg, #7864ff, #64c8ff);
        }

        @keyframes rippleEffect {
            0% { transform: scale(0); opacity: 0.3; }
            100% { transform: scale(5); opacity: 0; }
        }
    </style>
</head>
<body class="theme-light">
    <!-- Фоновый ripple -->
    <div class="transition-container">
        <div class="ripple"></div>
    </div>

    <!-- Парящие иконки -->
    <div class="floating-icons">
        <div class="floating-icon">❤️</div>
        <div class="floating-icon">🤝</div>
        <div class="floating-icon">⭐</div>
        <div class="floating-icon">💪</div>
    </div>

    <!-- Основной контент -->
    <div class="transition-container">
        <!-- Анимированный поезд -->
        <div class="metro-scene">
            <div class="rails"></div>
            <div class="train" id="train">
                <div class="train-car">
                    <div class="train-wheels">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Цитаты в разных местах -->
        <div class="quote">Профсоюз — это сила единства</div>
        <div class="quote">Вместе мы можем больше</div>
        <div class="quote">Поддержка и взаимопомощь</div>
        <div class="quote">Каждая история имеет значение</div>

        <!-- Прогресс-бар и текст -->
        <div class="loading-wrapper">
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <div class="station-text">Следующая станция: <span>"Профсоюз"</span></div>
        </div>
    </div>

    <script>
        // Определяем тему
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.classList.remove('theme-light', 'theme-dark');
        document.body.classList.add('theme-' + savedTheme);

        // Получаем целевой URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = urlParams.get('to') || 'index.html';

        // Ждём, пока поезд доедет до конца
        const train = document.getElementById('train');
        
        train.addEventListener('animationend', function() {
            train.classList.add('arrived');
            
            setTimeout(() => {
                window.location.href = targetPage;
            }, 500);
        });
    </script>
</body>
</html>
